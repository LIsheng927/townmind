[project]
name = "townmind-server"
version = "0.1.0"
description = "TownMind agent server"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "anthropic>=0.40",
    "openai>=1.50",
    "python-dotenv>=1.0",
    # 记忆检索的向量化快路径（memory.py 里余弦相似度改成一次矩阵乘）。代码里是
    # try/except 可选导入、没装会自动退回纯 Python，但默认就该装上：不装的话
    # 同样的检索慢一两百倍，属于那种不报错、只是悄悄变卡的性能悬崖。
    "numpy>=1.24",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]
# 自研防御模型（guard/ 训练出来的 LoRA 分类器，townmind/guard_model.py）是可选的安全增强层，
# 默认不装：uv sync 默认不拉取这几百 MB 到几 GB 的推理库，想启用时用 `uv sync --group guard-model`。
# 没装这个组、或者没设 TOWNMIND_USE_GUARD_MODEL 环境变量，服务照常用纯正则规则运行。
guard-model = [
    "torch>=2.3",
    "transformers>=4.44",
    "peft>=0.12",
    "sentencepiece>=0.2",  # townmind/grounding.py 用的 mDeBERTa 分词器需要
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# uv sync 默认从 PyPI 拿 torch，PyPI 上的是纯 CPU 版；这里把 torch 单独指到 PyTorch
# 官方的 CUDA 12.8 源，RTX 50 系列（Blackwell 架构）至少要这个版本的 CUDA 才认得出来。
[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
